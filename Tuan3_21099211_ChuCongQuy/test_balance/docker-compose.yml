version: '3'
services:
  loadbalancer:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:80"
    depends_on:
      - web_server_1
      - web_server_2

  web_server_1:
    build: .
    container_name: web1

  web_server_2:
    build: .
    container_name: web2
